<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Decolum — Import Invoices</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="import-invoices.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>
</head>

<body>
  <div id="root"></div>
  <script type="text/babel">

    const SidebarIcon = ({ name }) => {
      const icons = {
        grid: <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><rect x="1" y="1" width="6" height="6" rx="1" /><rect x="11" y="1" width="6" height="6" rx="1" /><rect x="1" y="11" width="6" height="6" rx="1" /><rect x="11" y="11" width="6" height="6" rx="1" /></svg>,
        file: <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M10 1H4a1 1 0 00-1 1v14a1 1 0 001 1h10a1 1 0 001-1V6L10 1z" /><path d="M10 1v5h5" /></svg>,
        upload: <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M9 12V3M5 7l4-4 4 4M1 13v2a2 2 0 002 2h12a2 2 0 002-2v-2" /></svg>,
        sliders: <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><line x1="3" y1="15" x2="3" y2="9" /><line x1="3" y1="5" x2="3" y2="3" /><line x1="9" y1="15" x2="9" y2="11" /><line x1="9" y1="7" x2="9" y2="3" /><line x1="15" y1="15" x2="15" y2="7" /><line x1="15" y1="3" x2="15" y2="3" /><circle cx="3" cy="7" r="2" /><circle cx="9" cy="9" r="2" /><circle cx="15" cy="5" r="2" /></svg>,
        settings: <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><circle cx="9" cy="9" r="3" /><path d="M15.4 11a1.2 1.2 0 00.2 1.3l.1.1a1.4 1.4 0 11-2 2l-.1-.1a1.2 1.2 0 00-1.3-.2 1.2 1.2 0 00-.7 1.1v.2a1.4 1.4 0 11-2.8 0v-.1a1.2 1.2 0 00-.8-1.1 1.2 1.2 0 00-1.3.2l-.1.1a1.4 1.4 0 11-2-2l.1-.1a1.2 1.2 0 00.2-1.3 1.2 1.2 0 00-1.1-.7h-.2a1.4 1.4 0 110-2.8h.1a1.2 1.2 0 001.1-.8 1.2 1.2 0 00-.2-1.3l-.1-.1a1.4 1.4 0 112-2l.1.1a1.2 1.2 0 001.3.2h.1a1.2 1.2 0 00.7-1.1v-.2a1.4 1.4 0 112.8 0v.1a1.2 1.2 0 00.7 1.1 1.2 1.2 0 001.3-.2l.1-.1a1.4 1.4 0 112 2l-.1.1a1.2 1.2 0 00-.2 1.3v.1a1.2 1.2 0 001.1.7h.2a1.4 1.4 0 010 2.8h-.1a1.2 1.2 0 00-1.1.7z" /></svg>,
        exit: <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M6 16H3a1 1 0 01-1-1V3a1 1 0 011-1h3M12 13l4-4-4-4M16 9H6" /></svg>
      };
      return icons[name] || null;
    };

    const sidebarItems = [
      { label: 'Dashboard', icon: 'grid', href: 'index.html' },
      { label: 'Manage Invoices', icon: 'file', href: 'Manage Invoices.html' },
      { label: 'Import Invoices', icon: 'upload', active: true },
      { label: 'Options', icon: 'sliders' },
      { label: 'Settings', icon: 'settings' },
    ];

    const STEPS = [
      { text: 'Importing', duration: 3000 },
      { text: 'Parsing', duration: 4000 },
      { text: 'Saving', duration: 3000 },
    ];

    function App() {
      const [state, setState] = React.useState('idle'); // idle | loading | done
      const [stepIndex, setStepIndex] = React.useState(0);
      const [toast, setToast] = React.useState(null);
      const cancelRef = React.useRef(false);
      const fileRef = React.useRef(null);

      const handleImportClick = () => {
        fileRef.current.click();
      };

      const handleFileChange = (e) => {
        const count = e.target.files.length;
        if (!count) return;
        e.target.value = '';
        cancelRef.current = false;
        setState('loading');
        setStepIndex(0);
        runSteps(count);
      };

      const runSteps = async (count) => {
        for (let i = 0; i < STEPS.length; i++) {
          if (cancelRef.current) break;
          setStepIndex(i);
          await new Promise(r => setTimeout(r, STEPS[i].duration));
        }
        if (!cancelRef.current) {
          setToast(`Successfully imported ${count} invoice${count > 1 ? 's' : ''}`);
          setTimeout(() => setToast(null), 2000);
        }
        setState('idle');
      };

      const handleCancel = () => {
        cancelRef.current = true;
        setState('idle');
      };

      return (
        <div className="layout">
          <aside className="sidebar">
            <div className="sidebar-brand">
              <h1>Decolum</h1>
              <span>Project Everblue</span>
            </div>
            <nav className="sidebar-nav">
              {sidebarItems.map(item =>
                <a key={item.label} className={item.active ? 'active' : ''} href={item.href || '#'}>
                  <SidebarIcon name={item.icon} />{item.label}
                </a>
              )}
              <div className="spacer"></div>
              <a><SidebarIcon name="exit" />Exit</a>
            </nav>
          </aside>

          <header className="header">
            <h2>Import Invoices</h2>
            <div className="header-user">
              <span>Mark</span>
              <div className="header-avatar">M</div>
            </div>
          </header>

          <main className="main" style={{ position: 'relative' }}>
            {toast && <div className="toast" key={toast}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#166534" strokeWidth="1.5" strokeLinecap="round"><path d="M4 8.5l3 3 5-6" /><circle cx="8" cy="8" r="7" /></svg>
              {toast}
            </div>}
            <input
              type="file"
              accept=".pdf,application/pdf"
              multiple
              ref={fileRef}
              style={{ display: 'none' }}
              onChange={handleFileChange}
            />

            {state === 'idle' && (
              <button className="import-btn" onClick={handleImportClick}>
                <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
                  <path d="M9 12V3M5 7l4-4 4 4M1 13v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
                </svg>
                Import Invoices
              </button>
            )}

            {state === 'loading' && (
              <div className="loader-wrap">
                <div className="loader-inner">
                  <div className="loader-ring"></div>
                  <div className="loader-text">{STEPS[stepIndex].text}</div>
                </div>
                <button className="cancel-btn" onClick={handleCancel}>
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"><path d="M9 3L3 9M3 3l6 6" /></svg>
                  Cancel
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
